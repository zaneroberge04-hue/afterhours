# Rebuilds the feed every 6 hours and commits the new data. Cloudflare Pages redeploys
# on every push, so the live site refreshes itself with no server running.
# Needs one repo secret: YOUTUBE_API_KEY (Settings > Secrets and variables > Actions).
name: feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python build_feed.py
      - name: Commit data if it changed
        run: |
          git config user.name "afterhours-bot"
          git config user.email "afterhours-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Refresh feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
